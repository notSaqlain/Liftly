<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIFTLY - Documentazione di Progetto</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="L1.png">
    <link rel="icon" type="image/png" sizes="192x192" href="L1.png">
    <link rel="apple-touch-icon" href="L1.png">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- External CSS -->
    <link rel="stylesheet" href="css/styles.css">

</head>

<body class="text-slate-900">

    <div class="flex flex-col lg:flex-row min-h-screen">

        <!-- MOBILE HEADER -->
        <div class="lg:hidden bg-white border-b px-4 py-3 flex justify-between items-center sticky top-0 z-50">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 bg-[#001540] rounded flex items-center justify-center">
                    <span class="text-white text-xs font-bold">L↑</span>
                </div>
                <span class="font-bold text-xl tracking-tight text-[#001540]">Liftly Docs</span>
            </div>
            <button id="mobile-menu-btn" class="p-2 text-[#001540]">
                <i data-lucide="menu"></i>
            </button>
        </div>

        <!-- SIDEBAR MENU -->
        <aside id="sidebar"
            class="fixed inset-0 z-40 lg:static lg:block w-full lg:w-80 bg-white border-r flex flex-col transition-transform duration-300 transform -translate-x-full lg:translate-x-0 hidden h-screen overflow-y-auto print-hide">

            <div class="p-6 pb-2 sticky top-0 bg-white z-10 flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-[#001540] rounded-xl flex items-center justify-center shadow-lg">
                        <span class="text-white text-lg font-bold">L↑</span>
                    </div>
                    <img src="liftly.png" alt="LIFTLY" class="h-9 object-contain">
                </div>
                <button id="close-menu-btn" class="lg:hidden p-2 text-slate-500">
                    <i data-lucide="x"></i>
                </button>
            </div>

            <nav class="flex-1 p-4 space-y-1">

                <!-- 1. PROJECT CHARTER (Dropdown) -->
                <div>
                    <button onclick="toggleMenu('menu-charter', 'icon-charter')"
                        class="w-full flex items-center justify-between px-4 py-3 rounded-xl text-slate-700 font-bold hover:bg-slate-50 transition-colors">
                        <div class="flex items-center gap-3"><i data-lucide="folder-open" class="w-5 h-5"></i> Project
                            Charter</div>
                        <i data-lucide="chevron-down" id="icon-charter"
                            class="w-4 h-4 transition-transform duration-200"></i>
                    </button>
                    <div id="menu-charter" class="hidden pl-10 pr-4 py-1 border-l-2 border-slate-100 ml-6 relative">
                        <button onclick="showSection('charter/charter-liftly', this, true)"
                            class="submenu-link w-full text-left text-sm text-slate-500 py-2 hover:text-[#001540] transition-colors relative">LIFTLY</button>
                        <button onclick="showSection('charter/charter-fixflow', this, true)"
                            class="submenu-link w-full text-left text-sm text-slate-500 py-2 hover:text-[#001540] transition-colors relative">FIXFLOW</button>
                    </div>
                </div>

                <!-- 2. SRS (Dropdown) -->
                <div>
                    <button onclick="toggleMenu('menu-srs', 'icon-srs')"
                        class="w-full flex items-center justify-between px-4 py-3 rounded-xl text-slate-700 font-bold hover:bg-slate-50 transition-colors">
                        <div class="flex items-center gap-3"><i data-lucide="file-text" class="w-5 h-5"></i> SRS</div>
                        <i data-lucide="chevron-down" id="icon-srs"
                            class="w-4 h-4 transition-transform duration-200"></i>
                    </button>
                    <div id="menu-srs" class="hidden pl-10 pr-4 py-1 border-l-2 border-slate-100 ml-6 relative">
                        <button onclick="scrollToSrsSection('introduzione', this)"
                            class="submenu-link srs-nav-link w-full text-left text-sm text-slate-500 py-2 hover:text-[#001540] transition-colors relative" data-target="introduzione">1.
                            Introduzione</button>
                        <button onclick="scrollToSrsSection('requisiti-funzionali', this)"
                            class="submenu-link srs-nav-link w-full text-left text-sm text-slate-500 py-2 hover:text-[#001540] transition-colors relative" data-target="requisiti-funzionali">2.
                            Requisiti Funzionali</button>
                        <button onclick="scrollToSrsSection('requisiti-non-funzionali', this)"
                            class="submenu-link srs-nav-link w-full text-left text-sm text-slate-500 py-2 hover:text-[#001540] transition-colors relative" data-target="requisiti-non-funzionali">3.
                            Requisiti Non Funz</button>
                        <button onclick="scrollToSrsSection('architettura', this)"
                            class="submenu-link srs-nav-link w-full text-left text-sm text-slate-500 py-2 hover:text-[#001540] transition-colors relative" data-target="architettura">4.
                            Architettura</button>
                        <button onclick="scrollToSrsSection('ambito', this)"
                            class="submenu-link srs-nav-link w-full text-left text-sm text-slate-500 py-2 hover:text-[#001540] transition-colors relative" data-target="ambito">5.
                            Ambito</button>
                        <button onclick="scrollToSrsSection('definizioni', this)"
                            class="submenu-link srs-nav-link w-full text-left text-sm text-slate-500 py-2 hover:text-[#001540] transition-colors relative" data-target="definizioni">6.
                            Definizioni</button>
                    </div>
                </div>

                <!-- 3. WBS (Direct Link) -->
                <button onclick="showSection('wbs/wbs', this, false)"
                    class="main-link w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-700 font-bold hover:bg-slate-50 transition-colors">
                    <i data-lucide="network" class="w-5 h-5"></i> WBS
                </button>

                <!-- 4. OBS (Direct Link) -->
                <button onclick="showSection('obs', this, false)"
                    class="main-link w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-700 font-bold hover:bg-slate-50 transition-colors">
                    <i data-lucide="users" class="w-5 h-5"></i> OBS
                </button>

                <!-- 5. RACI (Direct Link) -->
                <button onclick="showSection('raci', this, false)"
                    class="main-link w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-700 font-bold hover:bg-slate-50 transition-colors">
                    <i data-lucide="table" class="w-5 h-5"></i> Matrice RACI
                </button>

                <!-- 6. GANTT & COSTI (Direct Link) -->
                <button onclick="showSection('gantt', this, false)"
                    class="main-link w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-700 font-bold hover:bg-slate-50 transition-colors">
                    <i data-lucide="calendar-days" class="w-5 h-5"></i> Gantt & Costi
                </button>

                <!-- 7. CODICE (Direct Link) -->
                <button onclick="showSection('codice', this, false)"
                    class="main-link w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-700 font-bold hover:bg-slate-50 transition-colors">
                    <i data-lucide="code" class="w-5 h-5"></i> Descrizione Codice
                </button>

                <!-- 8. MANUALE (Direct Link) -->
                <button onclick="showSection('manuale', this, false)"
                    class="main-link w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-700 font-bold hover:bg-slate-50 transition-colors">
                    <i data-lucide="book-open" class="w-5 h-5"></i> Manuale d'Uso
                </button>

            </nav>

            <!-- TEAM CARD -->
            <div class="p-6 pt-0 mt-auto">
                <div class="p-4 bg-slate-50 rounded-2xl border border-slate-200">
                    <p class="text-[10px] uppercase tracking-widest text-slate-400 font-bold mb-3">Team</p>
                    <div class="space-y-2">
                        <div class="flex items-center gap-2">
                            <div
                                class="w-6 h-6 rounded border border-blue-200 bg-blue-50 flex items-center justify-center text-blue-600 font-bold text-[10px]">
                                D</div>
                            <span class="text-xs font-semibold text-slate-700">Davide (PM)</span>
                        </div>
                        <div class="flex items-center gap-2">
                            <div
                                class="w-6 h-6 rounded border border-emerald-200 bg-emerald-50 flex items-center justify-center text-emerald-600 font-bold text-[10px]">
                                S</div>
                            <span class="text-xs font-semibold text-slate-700">Saqlain (Tech)</span>
                        </div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- MAIN CONTENT -->
        <main class="flex-1 p-4 lg:p-10 overflow-y-auto w-full">
            <div id="main-content-area" class="max-w-5xl mx-auto">
                <!-- Content gets injected here via AJAX -->
            </div>
        </main>
    </div>

    <!-- External JavaScript -->
    <script src="js/app.js"></script>

</body>

</html>
