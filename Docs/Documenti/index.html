<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIFTLY - Documentazione di Progetto</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="L1.png">
    <link rel="icon" type="image/png" sizes="192x192" href="L1.png">
    <link rel="apple-touch-icon" href="L1.png">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- External CSS -->
    <link rel="stylesheet" href="css/styles.css">

</head>

<body class="text-slate-900">

    <div class="flex flex-col lg:flex-row min-h-screen">

        <!-- MOBILE HEADER -->
        <div class="lg:hidden bg-white border-b px-4 py-3 flex justify-between items-center sticky top-0 z-50">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 bg-[#001540] rounded flex items-center justify-center">
                    <span class="text-white text-xs font-bold">L↑</span>
                </div>
                <span class="font-bold text-xl tracking-tight text-[#001540]">Liftly Docs</span>
            </div>
            <button id="mobile-menu-btn" class="p-2 text-[#001540]">
                <i data-lucide="menu"></i>
            </button>
        </div>

        <!-- SIDEBAR MENU -->
        <aside id="sidebar"
            class="fixed inset-0 z-40 lg:sticky lg:top-0 w-full lg:w-80 bg-white border-r flex flex-col transition-transform duration-300 transform -translate-x-full lg:translate-x-0 hidden lg:flex h-screen overflow-y-auto print-hide">

            <div class="p-4 border-b border-slate-200 sticky top-0 bg-white z-10 flex justify-between items-center">
                <div class="flex items-center gap-2">
                    <div class="w-6 h-6 bg-[#001540] rounded flex items-center justify-center shadow-sm">
                        <span class="text-white text-xs font-bold">L↑</span>
                    </div>
                    <span class="font-black text-sm text-[#001540] tracking-wider uppercase">Explorer</span>
                </div>
                <button id="close-menu-btn" class="lg:hidden p-1 text-slate-500">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <nav class="flex-1 overflow-y-auto text-sm text-slate-600 font-medium pb-6 pt-2 select-none">
                <!-- Landing Page -->
                <button onclick="openFile('landing-page', 'Home')"
                    class="file-link w-full text-left flex items-center gap-2 px-6 py-1.5 hover:bg-slate-100 hover:text-[#001540] focus:outline-none transition-colors"
                    data-path="landing-page">
                    <i data-lucide="file-text" class="w-4 h-4 text-slate-400 shrink-0"></i>
                    <span class="truncate">Home</span>
                </button>
                <!-- Download APK -->
                <button onclick="openFile('download', 'Download APK')"
                    class="file-link w-full text-left flex items-center gap-2 px-6 py-1.5 hover:bg-slate-100 hover:text-[#001540] focus:outline-none transition-colors"
                    data-path="download">
                    <i data-lucide="smartphone" class="w-4 h-4 text-pink-500 shrink-0"></i>
                    <span class="truncate font-semibold text-pink-600">Download APK</span>
                </button>
                <button onclick="openFile('idea', 'B2B Strategy')"
                    class="file-link w-full text-left flex items-center gap-2 px-6 py-1.5 hover:bg-slate-100 hover:text-[#001540] focus:outline-none transition-colors"
                    data-path="idea">
                    <i data-lucide="lightbulb" class="w-4 h-4 text-amber-500 shrink-0"></i>
                    <span class="truncate font-bold text-[#001540]">B2B Strategy</span>
                </button>
                <button onclick="openFile('codice', 'Descrizione Codice')"
                    class="file-link w-full text-left flex items-center gap-2 px-6 py-1.5 hover:bg-slate-100 hover:text-[#001540] focus:outline-none transition-colors"
                    data-path="codice">
                    <i data-lucide="code" class="w-4 h-4 text-pink-500 shrink-0"></i>
                    <span class="truncate font-bold text-[#001540]">Descrizione Codice</span>
                </button>
                <button onclick="openFile('manuale', 'Manuale d\'Uso')"
                    class="file-link w-full text-left flex items-center gap-2 px-6 py-1.5 hover:bg-slate-100 hover:text-[#001540] focus:outline-none transition-colors"
                    data-path="manuale">
                    <i data-lucide="book-open" class="w-4 h-4 text-teal-500 shrink-0"></i>
                    <span class="truncate font-bold text-[#001540]">Manuale d'Uso</span>
                </button>

                <!-- V2 Folder -->
                <div class="mt-2">
                    <button onclick="toggleFolder('folder-v2', 'icon-f-v2', 'icon-folder-v2')"
                        class="mx-2 w-[calc(100%-1rem)] text-left flex items-center gap-2 px-2 py-1.5 bg-yellow-50 hover:bg-yellow-100/70 rounded-md focus:outline-none transition-colors font-bold text-[#001540]">
                        <i data-lucide="chevron-down" id="icon-f-v2"
                            class="w-4 h-4 transition-transform duration-200 shrink-0"></i>
                        <i data-lucide="folder-open" id="icon-folder-v2" class="w-4 h-4 text-yellow-500 shrink-0"></i>
                        <span class="truncate">Liftly V2 (B2B)</span>
                    </button>
                    <div id="folder-v2" class="block">
                        <button onclick="openFile('v2/charter-liftly', 'Project Charter V2')"
                            class="file-link w-full text-left flex items-center gap-2 pl-10 pr-4 py-1.5 hover:bg-slate-100 hover:text-[#001540] focus:outline-none transition-colors"
                            data-path="v2/charter-liftly">
                            <i data-lucide="file-text" class="w-4 h-4 text-blue-500 shrink-0"></i>
                            <span class="truncate">Project Charter V2</span>
                        </button>
                        <button onclick="openFile('v2/srs-all', 'SRS V2')"
                            class="file-link w-full text-left flex items-center gap-2 pl-10 pr-4 py-1.5 hover:bg-slate-100 hover:text-[#001540] focus:outline-none transition-colors"
                            data-path="v2/srs-all">
                            <i data-lucide="file-code" class="w-4 h-4 text-emerald-500 shrink-0"></i>
                            <span class="truncate">SRS V2</span>
                        </button>
                        <button onclick="openFile('v2/wbs', 'WBS V2')"
                            class="file-link w-full text-left flex items-center gap-2 pl-10 pr-4 py-1.5 hover:bg-slate-100 hover:text-[#001540] focus:outline-none transition-colors"
                            data-path="v2/wbs">
                            <i data-lucide="bar-chart-2" class="w-4 h-4 text-purple-500 shrink-0"></i>
                            <span class="truncate">WBS V2</span>
                        </button>
                        <button onclick="openFile('v2/gantt', 'Gantt V2')"
                            class="file-link w-full text-left flex items-center gap-2 pl-10 pr-4 py-1.5 hover:bg-slate-100 hover:text-[#001540] focus:outline-none transition-colors"
                            data-path="v2/gantt">
                            <i data-lucide="calendar" class="w-4 h-4 text-orange-500 shrink-0"></i>
                            <span class="truncate">Gantt V2</span>
                        </button>
                        <button onclick="openFile('v2/obs', 'OBS')"
                            class="file-link w-full text-left flex items-center gap-2 pl-10 pr-4 py-1.5 hover:bg-slate-100 hover:text-[#001540] focus:outline-none transition-colors"
                            data-path="v2/obs">
                            <i data-lucide="users" class="w-4 h-4 text-indigo-500 shrink-0"></i>
                            <span class="truncate">OBS</span>
                        </button>
                    </div>
                </div>

                <!-- V1 Folder -->
                <div class="mt-2">
                    <button onclick="toggleFolder('folder-v1', 'icon-f-v1', 'icon-folder-v1')"
                        class="mx-2 w-[calc(100%-1rem)] text-left flex items-center gap-2 px-2 py-1.5 bg-blue-50/70 hover:bg-blue-100 rounded-md focus:outline-none transition-colors font-bold text-slate-600">
                        <i data-lucide="chevron-right" id="icon-f-v1"
                            class="w-4 h-4 transition-transform duration-200 shrink-0"></i>
                        <i data-lucide="folder" id="icon-folder-v1" class="w-4 h-4 text-slate-400 shrink-0"></i>
                        <span class="truncate">Liftly V1 (Archive)</span>
                    </button>
                    <div id="folder-v1" class="hidden">
                        <button onclick="openFile('v1/charter/charter-liftly', 'Project Charter V1')"
                            class="file-link w-full text-left flex items-center gap-2 pl-10 pr-4 py-1.5 hover:bg-slate-100 hover:text-[#001540] focus:outline-none transition-colors"
                            data-path="v1/charter/charter-liftly">
                            <i data-lucide="file-text" class="w-4 h-4 text-blue-400 shrink-0"></i>
                            <span class="truncate">Project Charter V1</span>
                        </button>
                        <button onclick="openFile('v1/srs/srs-all', 'SRS V1')"
                            class="file-link w-full text-left flex items-center gap-2 pl-10 pr-4 py-1.5 hover:bg-slate-100 hover:text-[#001540] focus:outline-none transition-colors"
                            data-path="v1/srs/srs-all">
                            <i data-lucide="file-code" class="w-4 h-4 text-emerald-400 shrink-0"></i>
                            <span class="truncate">SRS V1</span>
                        </button>
                        <button onclick="openFile('v1/wbs/wbs', 'WBS V1')"
                            class="file-link w-full text-left flex items-center gap-2 pl-10 pr-4 py-1.5 hover:bg-slate-100 hover:text-[#001540] focus:outline-none transition-colors"
                            data-path="v1/wbs/wbs">
                            <i data-lucide="bar-chart-2" class="w-4 h-4 text-purple-400 shrink-0"></i>
                            <span class="truncate">WBS V1</span>
                        </button>
                        <button onclick="openFile('v1/gantt', 'Gantt V1')"
                            class="file-link w-full text-left flex items-center gap-2 pl-10 pr-4 py-1.5 hover:bg-slate-100 hover:text-[#001540] focus:outline-none transition-colors"
                            data-path="v1/gantt">
                            <i data-lucide="calendar" class="w-4 h-4 text-orange-400 shrink-0"></i>
                            <span class="truncate">Gantt V1</span>
                        </button>
                        <button onclick="openFile('v1/obs', 'OBS')"
                            class="file-link w-full text-left flex items-center gap-2 pl-10 pr-4 py-1.5 hover:bg-slate-100 hover:text-[#001540] focus:outline-none transition-colors"
                            data-path="v1/obs">
                            <i data-lucide="users" class="w-4 h-4 text-indigo-400 shrink-0"></i>
                            <span class="truncate">OBS</span>
                        </button>
                    </div>
                </div>

                <!-- FixFlow Folder -->
                <div class="mt-2">
                    <button onclick="toggleFolder('folder-fixflow', 'icon-f-fixflow', 'icon-folder-fixflow')"
                        class="mx-2 w-[calc(100%-1rem)] text-left flex items-center gap-2 px-2 py-1.5 bg-slate-50 hover:bg-slate-100 rounded-md focus:outline-none transition-colors font-bold text-slate-500">
                        <i data-lucide="chevron-right" id="icon-f-fixflow"
                            class="w-4 h-4 transition-transform duration-200 shrink-0"></i>
                        <i data-lucide="folder" id="icon-folder-fixflow" class="w-4 h-4 text-slate-400 shrink-0"></i>
                        <span class="truncate">FixFlow (Piano B)</span>
                    </button>
                    <div id="folder-fixflow" class="hidden">
                        <button onclick="openFile('v1/charter/charter-fixflow', 'Charter FixFlow')"
                            class="file-link w-full text-left flex items-center gap-2 pl-10 pr-4 py-1.5 hover:bg-slate-100 hover:text-[#001540] focus:outline-none transition-colors"
                            data-path="v1/charter/charter-fixflow">
                            <i data-lucide="file-text" class="w-4 h-4 text-blue-400 shrink-0"></i>
                            <span class="truncate">Charter FixFlow</span>
                        </button>
                    </div>
                </div>

            </nav>




            <!-- TEAM CARD -->
            <div class="p-6 pt-0 mt-auto">
                <div class="p-4 bg-slate-50 rounded-2xl border border-slate-200">
                    <p class="text-[10px] uppercase tracking-widest text-slate-400 font-bold mb-3">Team</p>
                    <div class="space-y-2">
                        <div class="flex items-center gap-2">
                            <div class="w-6 h-6 rounded border border-blue-200 bg-blue-50 flex items-center justify-center text-blue-600 font-bold text-[10px]">D</div>
                            <span class="text-xs font-semibold text-slate-700">Davide (PM)</span>
                        </div>
                        <div class="flex items-center gap-2">
                            <div class="w-6 h-6 rounded border border-emerald-200 bg-emerald-50 flex items-center justify-center text-emerald-600 font-bold text-[10px]">S</div>
                            <span class="text-xs font-semibold text-slate-700">Saqlain (Tech)</span>
                        </div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- MAIN CONTENT -->
        <main class="flex-1 flex flex-col h-screen overflow-hidden w-full bg-white relative">
            <!-- Tab Bar -->
            <div id="tab-bar-container"
                class="flex items-end bg-[#f3f4f6] border-b border-slate-200 overflow-x-auto h-[42px] shrink-0 px-2 gap-1"
                style="-ms-overflow-style: none; scrollbar-width: none;">
                <!-- Tabs will be rendered here via JS -->
            </div>

            <!-- Content Scroll Area -->
            <div class="flex-1 overflow-y-auto p-4 lg:p-10 relative bg-white">
                <div id="main-content-area" class="max-w-5xl mx-auto pb-20">
                    <!-- Content gets injected here via AJAX -->
                </div>
            </div>
        </main>
    </div>

    <!-- External JavaScript -->
    <script src="js/app.js"></script>

</body>

</html>
