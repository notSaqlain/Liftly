<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIFTLY - Documentazione di Progetto</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="L1.png">
    <link rel="icon" type="image/png" sizes="192x192" href="L1.png">
    <link rel="apple-touch-icon" href="L1.png">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- External CSS -->
    <link rel="stylesheet" href="css/styles.css">

</head>

<body class="text-slate-900">

    <div class="flex flex-col lg:flex-row min-h-screen">

        <!-- MOBILE HEADER -->
        <div class="lg:hidden bg-white border-b px-4 py-3 flex justify-between items-center sticky top-0 z-50">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 bg-[#001540] rounded flex items-center justify-center">
                    <span class="text-white text-xs font-bold">L↑</span>
                </div>
                <span class="font-bold text-xl tracking-tight text-[#001540]">Liftly Docs</span>
            </div>
            <button id="mobile-menu-btn" class="p-2 text-[#001540]">
                <i data-lucide="menu"></i>
            </button>
        </div>

        <!-- SIDEBAR MENU -->
        <aside id="sidebar"
            class="fixed inset-0 z-40 lg:sticky lg:top-0 w-full lg:w-80 bg-white border-r flex flex-col transition-transform duration-300 transform -translate-x-full lg:translate-x-0 hidden lg:flex h-screen overflow-y-auto print-hide">

            <div class="p-6 pb-2 sticky top-0 bg-white z-10 flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-[#001540] rounded-xl flex items-center justify-center shadow-lg">
                        <span class="text-white text-lg font-bold">L↑</span>
                    </div>
                    <img src="liftly.png" alt="LIFTLY" class="h-9 object-contain">
                </div>
                <button id="close-menu-btn" class="lg:hidden p-2 text-slate-500">
                    <i data-lucide="x"></i>
                </button>
            </div>

            <nav class="flex-1 p-4 space-y-1">

                <!-- ══════════ V2 — B2B (ATTUALE) ══════════ -->
                <div class="mb-2">
                    <button onclick="toggleMenu('menu-v2', 'icon-v2')"
                        class="w-full flex items-center justify-between px-3 py-2.5 rounded-xl bg-[#001540] text-white font-black text-sm hover:bg-[#002070] transition-colors">
                        <div class="flex items-center gap-2">
                            <i data-lucide="folder-open" class="w-4 h-4 text-yellow-400"></i>
                            <span>📁 Liftly V2</span>
                            <span class="text-[9px] bg-yellow-400 text-yellow-900 font-black px-1.5 py-0.5 rounded-full uppercase tracking-wide">B2B</span>
                        </div>
                        <i data-lucide="chevron-down" id="icon-v2" class="w-4 h-4 transition-transform duration-200 rotate-180"></i>
                    </button>
                    <div id="menu-v2" class="block pl-10 pr-4 py-1 border-l-2 border-yellow-300 ml-4 relative mt-1">
                        <!-- Charter V2 -->
                        <button onclick="showSection('v2/charter-liftly', this, true)"
                            class="submenu-link w-full text-left text-sm text-slate-500 py-2 hover:text-[#001540] transition-colors relative">
                            Project Charter V2
                        </button>
                        <!-- SRS V2 with sub-nav -->
                        <button onclick="handleSrsV2Click()"
                            class="w-full flex items-center justify-between text-sm text-slate-500 py-2 hover:text-[#001540] transition-colors">
                            <span>SRS V2</span>
                            <i data-lucide="chevron-down" id="icon-srs-v2" class="w-3 h-3 transition-transform duration-200"></i>
                        </button>
                        <div id="menu-srs-v2" class="hidden pl-4 py-1 border-l border-slate-100">
                            <button onclick="scrollToSrsV2Section('srs-v2-introduzione', this)"
                                class="submenu-link srs-v2-nav-link w-full text-left text-xs text-slate-400 py-1.5 hover:text-[#001540] transition-colors"
                                data-target="srs-v2-introduzione">1. Introduzione</button>
                            <button onclick="scrollToSrsV2Section('srs-v2-requisiti-funzionali', this)"
                                class="submenu-link srs-v2-nav-link w-full text-left text-xs text-slate-400 py-1.5 hover:text-[#001540] transition-colors"
                                data-target="srs-v2-requisiti-funzionali">2. Requisiti Funzionali</button>
                            <button onclick="scrollToSrsV2Section('srs-v2-requisiti-non-funzionali', this)"
                                class="submenu-link srs-v2-nav-link w-full text-left text-xs text-slate-400 py-1.5 hover:text-[#001540] transition-colors"
                                data-target="srs-v2-requisiti-non-funzionali">3. Requisiti Non Funz.</button>
                            <button onclick="scrollToSrsV2Section('srs-v2-architettura', this)"
                                class="submenu-link srs-v2-nav-link w-full text-left text-xs text-slate-400 py-1.5 hover:text-[#001540] transition-colors"
                                data-target="srs-v2-architettura">4. Architettura</button>
                            <button onclick="scrollToSrsV2Section('srs-v2-ambito', this)"
                                class="submenu-link srs-v2-nav-link w-full text-left text-xs text-slate-400 py-1.5 hover:text-[#001540] transition-colors"
                                data-target="srs-v2-ambito">5. Ambito</button>
                            <button onclick="scrollToSrsV2Section('srs-v2-definizioni', this)"
                                class="submenu-link srs-v2-nav-link w-full text-left text-xs text-slate-400 py-1.5 hover:text-[#001540] transition-colors"
                                data-target="srs-v2-definizioni">6. Definizioni</button>
                        </div>
                        <!-- WBS V2 -->
                        <button onclick="showSection('v2/wbs', this, true)"
                            class="submenu-link w-full text-left text-sm text-slate-500 py-2 hover:text-[#001540] transition-colors relative">
                            WBS V2
                        </button>
                        <!-- Gantt V2 -->
                        <button onclick="showSection('v2/gantt', this, true)"
                            class="submenu-link w-full text-left text-sm text-slate-500 py-2 hover:text-[#001540] transition-colors relative">
                            Gantt &amp; Costi V2
                        </button>
                    </div>
                </div>

                <!-- ══════════ V1 — B2C (ARCHIVIO) ══════════ -->
                <div class="mb-2">
                    <button onclick="toggleMenu('menu-v1', 'icon-v1')"
                        class="w-full flex items-center justify-between px-3 py-2.5 rounded-xl bg-slate-100 text-slate-600 font-black text-sm hover:bg-slate-200 transition-colors">
                        <div class="flex items-center gap-2">
                            <i data-lucide="archive" class="w-4 h-4 text-slate-400"></i>
                            <span>📁 Liftly V1</span>
                            <span class="text-[9px] bg-slate-300 text-slate-600 font-black px-1.5 py-0.5 rounded-full uppercase tracking-wide">Archivio</span>
                        </div>
                        <i data-lucide="chevron-down" id="icon-v1" class="w-4 h-4 transition-transform duration-200"></i>
                    </button>
                    <div id="menu-v1" class="hidden pl-10 pr-4 py-1 border-l-2 border-slate-200 ml-4 relative mt-1">
                        <!-- Charter V1 Dropdown -->
                        <button onclick="toggleMenu('menu-v1-charter', 'icon-v1-charter')"
                            class="w-full flex items-center justify-between text-sm text-slate-400 py-2 hover:text-[#001540] transition-colors font-semibold">
                            <span>Project Charter</span>
                            <i data-lucide="chevron-down" id="icon-v1-charter" class="w-3 h-3 transition-transform duration-200"></i>
                        </button>
                        <div id="menu-v1-charter" class="hidden pl-4 py-1 border-l border-slate-100">
                            <button onclick="showSection('v1/charter/charter-liftly', this, true)"
                                class="submenu-link w-full text-left text-xs text-slate-400 py-1.5 hover:text-[#001540] transition-colors">LIFTLY V1</button>
                            <button onclick="showSection('v1/charter/charter-fixflow', this, true)"
                                class="submenu-link w-full text-left text-xs text-slate-400 py-1.5 hover:text-[#001540] transition-colors">FIXFLOW</button>
                        </div>
                        <!-- SRS V1 -->
                        <button onclick="handleSrsClick()"
                            class="w-full flex items-center justify-between text-sm text-slate-400 py-2 hover:text-[#001540] transition-colors font-semibold">
                            <span>SRS</span>
                            <i data-lucide="chevron-down" id="icon-srs" class="w-3 h-3 transition-transform duration-200"></i>
                        </button>
                        <div id="menu-srs" class="hidden pl-4 py-1 border-l border-slate-100">
                            <button onclick="scrollToSrsSection('introduzione', this)"
                                class="submenu-link srs-nav-link w-full text-left text-xs text-slate-400 py-1.5 hover:text-[#001540] transition-colors" data-target="introduzione">1. Introduzione</button>
                            <button onclick="scrollToSrsSection('requisiti-funzionali', this)"
                                class="submenu-link srs-nav-link w-full text-left text-xs text-slate-400 py-1.5 hover:text-[#001540] transition-colors" data-target="requisiti-funzionali">2. Requisiti Funzionali</button>
                            <button onclick="scrollToSrsSection('requisiti-non-funzionali', this)"
                                class="submenu-link srs-nav-link w-full text-left text-xs text-slate-400 py-1.5 hover:text-[#001540] transition-colors" data-target="requisiti-non-funzionali">3. Requisiti Non Funz.</button>
                            <button onclick="scrollToSrsSection('architettura', this)"
                                class="submenu-link srs-nav-link w-full text-left text-xs text-slate-400 py-1.5 hover:text-[#001540] transition-colors" data-target="architettura">4. Architettura</button>
                            <button onclick="scrollToSrsSection('ambito', this)"
                                class="submenu-link srs-nav-link w-full text-left text-xs text-slate-400 py-1.5 hover:text-[#001540] transition-colors" data-target="ambito">5. Ambito</button>
                            <button onclick="scrollToSrsSection('definizioni', this)"
                                class="submenu-link srs-nav-link w-full text-left text-xs text-slate-400 py-1.5 hover:text-[#001540] transition-colors" data-target="definizioni">6. Definizioni</button>
                        </div>
                        <!-- WBS V1 -->
                        <button onclick="showSection('v1/wbs/wbs', this, true)"
                            class="submenu-link w-full text-left text-sm text-slate-400 py-2 hover:text-[#001540] transition-colors font-semibold">WBS</button>
                        <!-- OBS -->
                        <button onclick="showSection('obs', this, true)"
                            class="submenu-link w-full text-left text-sm text-slate-400 py-2 hover:text-[#001540] transition-colors font-semibold">OBS</button>
                        <!-- Gantt V1 -->
                        <button onclick="showSection('v1/gantt', this, true)"
                            class="submenu-link w-full text-left text-sm text-slate-400 py-2 hover:text-[#001540] transition-colors font-semibold">Gantt &amp; Costi</button>
                        <!-- Codice -->
                        <button onclick="showSection('codice', this, true)"
                            class="submenu-link w-full text-left text-sm text-slate-400 py-2 hover:text-[#001540] transition-colors font-semibold">Descrizione Codice</button>
                        <!-- Manuale -->
                        <button onclick="showSection('manuale', this, true)"
                            class="submenu-link w-full text-left text-sm text-slate-400 py-2 hover:text-[#001540] transition-colors font-semibold">Manuale d'Uso</button>
                    </div>
                </div>

            </nav>




            <!-- TEAM CARD -->
            <div class="p-6 pt-0 mt-auto">
                <div class="p-4 bg-slate-50 rounded-2xl border border-slate-200">
                    <p class="text-[10px] uppercase tracking-widest text-slate-400 font-bold mb-3">Team</p>
                    <div class="space-y-2">
                        <div class="flex items-center gap-2">
                            <div
                                class="w-6 h-6 rounded border border-blue-200 bg-blue-50 flex items-center justify-center text-blue-600 font-bold text-[10px]">
                                D</div>
                            <span class="text-xs font-semibold text-slate-700">Davide (PM)</span>
                        </div>
                        <div class="flex items-center gap-2">
                            <div
                                class="w-6 h-6 rounded border border-emerald-200 bg-emerald-50 flex items-center justify-center text-emerald-600 font-bold text-[10px]">
                                S</div>
                            <span class="text-xs font-semibold text-slate-700">Saqlain (Tech)</span>
                        </div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- MAIN CONTENT -->
        <main class="flex-1 p-4 lg:p-10 overflow-y-auto w-full">
            <div id="main-content-area" class="max-w-5xl mx-auto">
                <!-- Content gets injected here via AJAX -->
            </div>
        </main>
    </div>

    <!-- External JavaScript -->
    <script src="js/app.js"></script>

</body>

</html>
