<section id="download" class="section-content relative h-full min-h-[85vh] flex items-center justify-center p-4 lg:p-8">
    <style>
        .dl-container {
            position: relative;
            width: 100%;
            max-width: 1000px;
            background: #0f172a;
            border-radius: 32px;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 4rem 2rem;
            z-index: 1;
        }

        /* Animated Mesh Background */
        .dl-mesh {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background-color: #0f172a;
            background-image: 
                radial-gradient(at 0% 0%, rgba(131, 58, 180, 0.4) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(253, 29, 29, 0.4) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(252, 176, 69, 0.4) 0px, transparent 50%),
                radial-gradient(at 0% 100%, rgba(30, 58, 138, 0.4) 0px, transparent 50%);
            filter: blur(40px);
            opacity: 0.8;
            animation: mesh-breathe 10s ease-in-out infinite alternate;
        }

        @keyframes mesh-breathe {
            0% { transform: scale(1); opacity: 0.7; }
            100% { transform: scale(1.1); opacity: 0.9; }
        }

        .dl-content {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .dl-pill {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            padding: 0.5rem 1rem;
            border-radius: 999px;
            color: white;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            margin-bottom: 2rem;
        }

        .dl-title {
            font-size: clamp(2.5rem, 5vw, 4rem);
            font-weight: 900;
            color: white;
            line-height: 1.1;
            margin-bottom: 1rem;
            letter-spacing: -0.02em;
        }

        .dl-title span {
            background: linear-gradient(to right, #fbbf24, #f59e0b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .dl-desc {
            color: rgba(255, 255, 255, 0.7);
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 3rem;
        }

        /* Glassmorphism QR Card */
        .dl-qr-wrap {
            position: relative;
            padding: 1.5rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            backdrop-filter: blur(20px);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.3);
            margin-bottom: 3rem;
            transition: transform 0.3s ease;
        }

        .dl-qr-wrap:hover {
            transform: translateY(-5px);
        }

        .dl-qr-img {
            width: 220px;
            height: 220px;
            border-radius: 16px;
            background: white;
            padding: 1rem;
            object-fit: contain;
        }

        /* Floating elements */
        .dl-float {
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 0.75rem 1.25rem;
            border-radius: 16px;
            color: white;
            font-weight: 600;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            animation: float 6s ease-in-out infinite;
        }

        .dl-float-1 { top: -20px; left: -40px; animation-delay: 0s; }
        .dl-float-2 { bottom: 20px; right: -60px; animation-delay: 2s; }

        @media (max-width: 640px) {
            .dl-float { display: none; }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* Button */
        .dl-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            width: 100%;
            max-width: 300px;
            padding: 1rem 2rem;
            background: white;
            color: #0f172a;
            font-weight: 800;
            font-size: 1rem;
            border-radius: 16px;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 10px 25px rgba(255, 255, 255, 0.2);
        }

        .dl-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 15px 35px rgba(255, 255, 255, 0.3);
            background: #f8fafc;
        }

        .dl-note-bottom {
            margin-top: 2rem;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.5);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
    </style>

    <div class="dl-container">
        <div class="dl-mesh"></div>
        
        <div class="dl-content">
            <div class="dl-pill">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
                Installa App
            </div>

            <h1 class="dl-title">
                Scarica <span>Liftly.</span>
            </h1>
            <p class="dl-desc">
                Inquadra il QR Code per scaricare l'APK direttamente dal nostro profilo Instagram, oppure usa il pulsante qui sotto.
            </p>

            <div class="dl-qr-wrap">
                <div class="dl-float dl-float-1">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.7 9.05 7.4c1.39.06 2.31.74 3.08.75.81-.04 1.58-.73 3.02-.83 1.68-.12 2.97.54 3.8 1.74-3.45 2.05-2.88 6.9.87 8.19-.64 1.45-1.16 2.21-2.77 3.03zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/></svg>
                    Android
                </div>
                <div class="dl-float dl-float-2">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
                    Free
                </div>
                
                <img src="qr-code.png" alt="Liftly QR Code" class="dl-qr-img" />
            </div>

            <a href="https://www.instagram.com/liftly.app" target="_blank" rel="noopener noreferrer" class="dl-btn">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="20" x="2" y="2" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" x2="17.51" y1="6.5" y2="6.5"/></svg>
                Apri su Instagram
            </a>

            <div class="dl-note-bottom">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
                Ricorda di abilitare "Sorgenti Sconosciute" per installare.
            </div>
        </div>
    </div>
</section>
