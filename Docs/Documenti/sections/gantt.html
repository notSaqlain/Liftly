                ]

        ];

        /* ═══════════════  HELPERS  ═══════════════ */
        const parseDate = s => new Date(s + 'T00:00:00');
        const daysBetween = (a, b) => Math.round((b - a) / 86400000);
        const formatDate = d => `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}`;

        // Global timeline
        const globalStart = parseDate('2026-02-09'); // start on a Monday before project
        const globalEnd   = parseDate('2026-05-11'); // end after project
        const totalDays   = daysBetween(globalStart, globalEnd);

        // Generate weeks
        function getWeeks() {
            const weeks = [];
            let d = new Date(globalStart);
            while (d < globalEnd) {
                const weekEnd = new Date(d);
                weekEnd.setDate(weekEnd.getDate() + 6);
                const months = ['Gen','Feb','Mar','Apr','Mag','Giu','Lug','Ago','Set','Ott','Nov','Dic'];
                weeks.push({
                    start: new Date(d),
                    end: weekEnd > globalEnd ? new Date(globalEnd) : weekEnd,
                    label: `${formatDate(d)}`,
                    month: months[d.getMonth()]
                });
                d.setDate(d.getDate() + 7);
            }
            return weeks;
        }

        // Build flat row list
        function buildRows() {
            const rows = [];
            phases.forEach(phase => {
                rows.push({ type: 'phase', ...phase });
                phase.tasks.forEach(task => {
                    rows.push({ type: 'task', phaseCls: phase.cls, ...task });
                });
            });
            return rows;
        }

            const chart = document.getElementById('ganttChart');
            const weeks = getWeeks();
            const rows  = buildRows();
            const ROW_H = 38;
            const HEADER_H = 56;

            // Set grid
            chart.style.gridTemplateColumns = `280px 1fr`;
            chart.style.gridTemplateRows = `${HEADER_H}px 1fr`;
            chart.innerHTML = '';

            // ── Task List ──
            const taskList = document.createElement('div');
            taskList.className = 'gantt-task-list';

            const taskHeader = document.createElement('div');
            taskHeader.className = 'gantt-task-header';
            taskHeader.textContent = 'Attività';
            taskList.appendChild(taskHeader);

            rows.forEach(row => {
                const el = document.createElement('div');
                el.className = 'gantt-task-row';
                if (row.type === 'phase') {
                    el.classList.add('phase-row-item', `phase-${row.cls}-item`);
                    el.innerHTML = `<span class="task-code">${row.id}</span><span class="task-name">${row.name}</span>`;
                } else {
                    el.innerHTML = `<span class="task-code">${row.id}</span><span class="task-name">${row.name}</span>`;
                }
                taskList.appendChild(el);
            });
            chart.appendChild(taskList);

            // ── Timeline ──
            const timeline = document.createElement('div');
            timeline.className = 'gantt-timeline';

            // Header
            const tlHeader = document.createElement('div');
            tlHeader.className = 'gantt-timeline-header';
            weeks.forEach(w => {
                const col = document.createElement('div');
                col.className = 'gantt-week-col';
                col.innerHTML = `<span class="week-month">${w.month}</span><span class="week-range">${w.label}</span>`;
                tlHeader.appendChild(col);
            });
            timeline.appendChild(tlHeader);

            // Bars area
            const barsArea = document.createElement('div');
            barsArea.className = 'gantt-bars-area';
            barsArea.style.position = 'relative';
            barsArea.style.height = `${rows.length * ROW_H}px`;

            // Grid lines (weekly)
            const weekWidth = 100 / weeks.length;
            weeks.forEach((w, i) => {
                const line = document.createElement('div');
                line.className = 'gantt-grid-line';
                line.style.left = `${i * weekWidth}%`;
                barsArea.appendChild(line);
            });

            // Today line
            const today = new Date();
            today.setHours(0,0,0,0);
            const todayOffset = daysBetween(globalStart, today);
            if (todayOffset >= 0 && todayOffset <= totalDays) {
                const todayLine = document.createElement('div');
                todayLine.className = 'gantt-today-line';
                todayLine.style.left = `${(todayOffset / totalDays) * 100}%`;
                todayLine.innerHTML = '<div class="gantt-today-dot"></div>';
                barsArea.appendChild(todayLine);
            }

            // Bars
            const barElements = [];
            rows.forEach((row, i) => {
                const barRow = document.createElement('div');
                barRow.className = 'gantt-bar-row';
                barRow.style.height = `${ROW_H}px`;

                const start = parseDate(row.start);
                const end   = parseDate(row.end);
                const offsetDays = daysBetween(globalStart, start);
                const durationDays = daysBetween(start, end) + 1;
                const leftPct  = (offsetDays / totalDays) * 100;
                const widthPct = (durationDays / totalDays) * 100;

                if (row.type === 'phase') {
                    const bar = document.createElement('div');
                    bar.className = `gantt-bar bar-phase`;
                    bar.style.left = `${leftPct}%`;
                    bar.style.width = `${widthPct}%`;
                    bar.dataset.row = i;
                    bar.dataset.info = JSON.stringify(row);
                    barRow.appendChild(bar);
                    barElements.push({ el: bar, row: i, data: row });
                } else if (row.milestone) {
                    const ms = document.createElement('div');
                    ms.className = 'gantt-milestone';
                    ms.style.left = `calc(${leftPct}% - 6px)`;
                    ms.dataset.row = i;
                    ms.dataset.info = JSON.stringify(row);
                    barRow.appendChild(ms);
                    barElements.push({ el: ms, row: i, data: row, isMilestone: true });
                } else {
                    const bar = document.createElement('div');
                    bar.className = `gantt-bar bar-${row.phaseCls}`;
                    bar.style.left = `${leftPct}%`;
                    bar.style.width = `${widthPct}%`;
                    if (durationDays >= 3) {
                        bar.textContent = row.id;
                    }
                    bar.dataset.row = i;
                    bar.dataset.info = JSON.stringify(row);
                    barRow.appendChild(bar);
                    barElements.push({ el: bar, row: i, data: row });
                }

                barsArea.appendChild(barRow);
            });

            // SVG for dependency arrows
            const svgNS = 'http://www.w3.org/2000/svg';
            const svg = document.createElementNS(svgNS, 'svg');
            svg.setAttribute('class', 'gantt-arrows-svg');
            svg.style.width = '100%';
            svg.style.height = `${rows.length * ROW_H}px`;

            // Arrowhead marker
            const defs = document.createElementNS(svgNS, 'defs');
            const marker = document.createElementNS(svgNS, 'marker');
            marker.setAttribute('id', 'arrowhead');
            marker.setAttribute('markerWidth', '8');
            marker.setAttribute('markerHeight', '6');
            marker.setAttribute('refX', '8');
            marker.setAttribute('refY', '3');
            marker.setAttribute('orient', 'auto');
            const arrowPath = document.createElementNS(svgNS, 'path');
            arrowPath.setAttribute('d', 'M0,0 L8,3 L0,6 Z');
            marker.appendChild(arrowPath);
            defs.appendChild(marker);
            svg.appendChild(defs);

            barsArea.appendChild(svg);
            timeline.appendChild(barsArea);
            chart.appendChild(timeline);

            // ── Draw dependency arrows ──
            requestAnimationFrame(() => {
                const barsRect = barsArea.getBoundingClientRect();
                const arrowPaths = [];

                // Sequential dependencies within each phase
                for (let idx = 0; idx < rows.length; idx++) {
                    const row = rows[idx];
                    if (row.type !== 'task') continue;

                    // Find next task in same phase
                    let nextIdx = -1;
                    for (let j = idx + 1; j < rows.length; j++) {
                        if (rows[j].type === 'phase') break;
                        if (rows[j].type === 'task') { nextIdx = j; break; }
                    }
                    if (nextIdx === -1) continue;

                    const fromBar = barElements.find(b => b.row === idx);
                    const toBar   = barElements.find(b => b.row === nextIdx);
                    if (!fromBar || !toBar) continue;

                    const fromRect = fromBar.el.getBoundingClientRect();
                    const toRect   = toBar.el.getBoundingClientRect();

                    const x1 = fromRect.right - barsRect.left;
                    const y1 = fromRect.top + fromRect.height / 2 - barsRect.top;
                    const x2 = toRect.left - barsRect.left;
                    const y2 = toRect.top + toRect.height / 2 - barsRect.top;

                    const path = document.createElementNS(svgNS, 'path');
                    const midX = x1 + (x2 - x1) * 0.5;
                    path.setAttribute('d', `M${x1},${y1} C${midX},${y1} ${midX},${y2} ${x2},${y2}`);
                    path.setAttribute('marker-end', 'url(#arrowhead)');
                    svg.appendChild(path);
                    arrowPaths.push(path);
                }

                // Also connect last task of one phase to first task of next phase
                for (let p = 0; p < phases.length - 1; p++) {
                    const phase = phases[p];
                    const nextPhase = phases[p + 1];
                    const lastTask = phase.tasks[phase.tasks.length - 1];
                    const firstTask = nextPhase.tasks[0];

                    const fromIdx = rows.findIndex(r => r.id === lastTask.id && r.type === 'task');
                    const toIdx   = rows.findIndex(r => r.id === firstTask.id && r.type === 'task');

                    if (fromIdx === -1 || toIdx === -1) continue;

                    const fromBar = barElements.find(b => b.row === fromIdx);
                    const toBar   = barElements.find(b => b.row === toIdx);
                    if (!fromBar || !toBar) continue;

                    const fromRect = fromBar.el.getBoundingClientRect();
                    const toRect   = toBar.el.getBoundingClientRect();

                    const x1 = fromRect.right - barsRect.left;
                    const y1 = fromRect.top + fromRect.height / 2 - barsRect.top;
                    const x2 = toRect.left - barsRect.left;
                    const y2 = toRect.top + toRect.height / 2 - barsRect.top;

                    const path = document.createElementNS(svgNS, 'path');
                    const midX = x1 + 15;
                    path.setAttribute('d', `M${x1},${y1} L${midX},${y1} L${midX},${y2} L${x2},${y2}`);
                    path.setAttribute('marker-end', 'url(#arrowhead)');
                    path.style.strokeDasharray = '4,4';
                    svg.appendChild(path);
                    arrowPaths.push(path);
                }

                // Animate arrows after bars
                setTimeout(() => {
                    arrowPaths.forEach((p, i) => {
                        setTimeout(() => p.classList.add('arrow-visible'), i * 80);
                    });
                }, barElements.length * 60 + 200);
            });

            // ── Animate bars sequentially ──
            barElements.forEach((b, i) => {
                setTimeout(() => {
                    b.el.classList.add('animate-in');
                }, i * 60 + 100);
            });

            // ── Tooltip ──
            const tooltip = document.getElementById('ganttTooltip');
            barElements.forEach(b => {
                b.el.addEventListener('mouseenter', (e) => {
                    const d = b.data;
                    const startFmt = formatDate(parseDate(d.start));
                    const endFmt   = formatDate(parseDate(d.end));
                    tooltip.innerHTML = `
                        <span class="tt-code">${d.id}</span><span class="tt-name">${d.name}</span>
                        <div class="tt-dates">${startFmt} → ${endFmt}${d.hours ? ` · <span class="tt-hours">${d.hours}h</span> · €${d.hours * COST_PER_HOUR}` : ''}</div>
                    `;
                    tooltip.classList.add('visible');
                });
                b.el.addEventListener('mousemove', (e) => {
                    tooltip.style.left = `${e.clientX + 14}px`;
                    tooltip.style.top  = `${e.clientY - 10}px`;
                });
                b.el.addEventListener('mouseleave', () => {
                    tooltip.classList.remove('visible');
                });
            });
        }

        /* ═══════════════  COSTS PANEL  ═══════════════ */
        function renderCosts() {
            const container = document.getElementById('costsByPhase');
            const colors = { avvio: '#38bdf8', pianif: '#fb923c', realiz: '#4ade80', chiusura: '#f87171' };
            let totalHours = 0;

            phases.forEach(phase => {
                const phaseHours = phase.tasks.reduce((s, t) => s + t.hours, 0);
                totalHours += phaseHours;
                const cost = phaseHours * COST_PER_HOUR;
                const el = document.createElement('div');
                el.className = 'flex items-center gap-3';
                el.innerHTML = `
                    <span style="width:14px;height:14px;border-radius:4px;background:${colors[phase.cls]};flex-shrink:0"></span>
                    <span class="flex-1 text-sm font-semibold text-slate-700">${phase.name}</span>
                    <span class="text-xs text-slate-400 font-medium">${phaseHours}h</span>
                    <span class="text-sm font-bold text-[#001540]">€ ${cost.toLocaleString('it-IT')}</span>
                `;
                container.appendChild(el);
            });

            // Total
            const totalEl = document.createElement('div');
            totalEl.className = 'flex items-center gap-3 pt-3 mt-3 border-t border-slate-200';
            totalEl.innerHTML = `
                <span style="width:14px;height:14px;flex-shrink:0"></span>
                <span class="flex-1 text-sm font-bold text-[#001540]">TOTALE</span>
                <span class="text-xs text-slate-500 font-bold">${totalHours}h</span>
                <span class="text-sm font-black text-emerald-600">€ ${(totalHours * COST_PER_HOUR).toLocaleString('it-IT')}</span>
            `;
            container.appendChild(totalEl);

            // Resource summary
            const resSummary = document.getElementById('resourceSummary');
            const resources = [
                { name: 'Davide Dolce', role: 'Project Manager', color: '#3b82f6', letter: 'D', rate: '€30/h' },
                { name: 'Saqlain', role: 'Technical Lead', color: '#10b981', letter: 'S', rate: '€30/h' }
            ];
            resources.forEach(r => {
                const el = document.createElement('div');
                el.className = 'flex items-center gap-3';
                el.innerHTML = `
                    <div style="width:32px;height:32px;border-radius:8px;background:${r.color}15;border:1.5px solid ${r.color}40;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.75rem;color:${r.color}">${r.letter}</div>
                    <div class="flex-1">
                        <div class="text-sm font-bold text-slate-800">${r.name}</div>
                        <div class="text-xs text-slate-400">${r.role}</div>
                    </div>
                    <span class="text-xs font-semibold text-slate-500 bg-slate-100 px-2 py-1 rounded-lg">${r.rate}</span>
                `;
                resSummary.appendChild(el);
            });
        }

        // Init
        render();
        renderCosts();

        // Re-render on resize (debounced)
        let resizeTimer;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(render, 250);
        });
    })();
    </script>
